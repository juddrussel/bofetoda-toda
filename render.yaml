services:
  # Main PHP Web Service
  - type: web
    name: bofetoda-app
    runtime: php
    plan: free  # Change to 'starter' for production (always-on)
    buildCommand: echo "No build step needed for PHP"
    startCommand: php -S 0.0.0.0:$PORT -t .
    healthCheckPath: /Driver_BOFETODA/driver-login.php
    
    envVars:
      - key: DB_HOST
        sync: false  # Set manually in Render dashboard
      - key: DB_PORT
        value: 3306
      - key: DB_NAME
        value: bofetoda
      - key: DB_USER
        sync: false  # Set manually in Render dashboard
      - key: DB_PASS
        sync: false  # Set manually in Render dashboard
      - key: APP_ENV
        value: production
      - key: APP_TIMEZONE
        value: Asia/Manila
    
    # Persistent storage for uploads
    disk:
      name: uploads
      mountPath: /opt/render/project/src/Driver_BOFETODA/uploads
      sizeGB: 1

# Note: MySQL database is hosted externally (PlanetScale)
# Configure the database credentials in Render dashboard under Environment
